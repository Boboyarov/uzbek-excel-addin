<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O‘zbek Kirill–Lotin</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; padding: 18px; color: #222; }
    h2 { font-size: 19px; margin: 0 0 8px; }
    p { line-height: 1.45; color: #555; }
    button { display:block; width:100%; padding:12px; margin:12px 0; border:0; border-radius:6px; cursor:pointer; font-size:15px; background:#176b3a; color:white; }
    button:nth-of-type(2) { background:#185abd; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { margin-top:14px; white-space:pre-wrap; font-size:13px; }
    .note { font-size:12px; color:#666; }
  </style>
</head>
<body>
  <h2>O‘zbek Kirill ↔ Lotin</h2>
  <p>Excelda kerakli kataklarni belgilang, so‘ng yo‘nalishni tanlang.</p>
  <button id="toLatin">Кирилл → Лотин</button>
  <button id="toCyrillic">Лотин → Кирилл</button>
  <div id="status" role="status">Excel tayyorlanmoqda…</div>
  <p class="note">Formulali kataklar o‘zgartirilmaydi. Avval fayl nusxasini saqlash tavsiya etiladi.</p>
<script>
const statusEl = document.getElementById("status");
const btns = [...document.querySelectorAll("button")];

function isApostrophe(c) {
  return ["'", "‘", "’", "`", "´", "ʻ", "ʼ"].includes(c);
}
function caseLike(src, upper, lower) {
  return src === src.toLocaleUpperCase("uz") && src !== src.toLocaleLowerCase("uz") ? upper : lower;
}
function cyrToLat(s) {
  const map = {
    "А":"A","а":"a","Б":"B","б":"b","В":"V","в":"v","Г":"G","г":"g",
    "Д":"D","д":"d","Е":"E","е":"e","Ё":"Yo","ё":"yo","Ж":"J","ж":"j",
    "З":"Z","з":"z","И":"I","и":"i","Й":"Y","й":"y","К":"K","к":"k",
    "Л":"L","л":"l","М":"M","м":"m","Н":"N","н":"n","О":"O","о":"o",
    "П":"P","п":"p","Р":"R","р":"r","С":"S","с":"s","Т":"T","т":"t",
    "У":"U","у":"u","Ф":"F","ф":"f","Х":"X","х":"x","Ц":"Ts","ц":"ts",
    "Ч":"Ch","ч":"ch","Ш":"Sh","ш":"sh","Ъ":"ʼ","ъ":"ʼ","Ь":"","ь":"",
    "Э":"E","э":"e","Ю":"Yu","ю":"yu","Я":"Ya","я":"ya",
    "Қ":"Q","қ":"q","Ғ":"G‘","ғ":"g‘","Ў":"O‘","ў":"o‘","Ҳ":"H","ҳ":"h"
  };
  let out = "";
  for (let i=0;i<s.length;i++) {
    const ch=s[i];
    if (ch==="Е" || ch==="е") {
      const prev = i===0 ? "" : s[i-1];
      const starts = i===0 || /[\s([{\/\-]/.test(prev);
      out += starts ? caseLike(ch,"Ye","ye") : map[ch];
    } else out += Object.prototype.hasOwnProperty.call(map,ch) ? map[ch] : ch;
  }
  return out;
}
function latToCyr(s) {
  let out = "", i = 0;
  while (i < s.length) {
    const ch=s[i], nx=s[i+1] || "", lower=(ch+nx).toLocaleLowerCase("uz");
    if ((ch.toLocaleLowerCase("uz")==="o" || ch.toLocaleLowerCase("uz")==="g") && isApostrophe(nx)) {
      out += ch.toLocaleLowerCase("uz")==="o" ? caseLike(ch,"Ў","ў") : caseLike(ch,"Ғ","ғ");
      i += 2; continue;
    }
    const pairs = {
      sh:["Ш","ш"], ch:["Ч","ч"], ng:["Нг","нг"],
      yo:["Ё","ё"], yu:["Ю","ю"], ya:["Я","я"], ts:["Ц","ц"]
    };
    if (pairs[lower]) {
      const [upper,low] = pairs[lower];
      out += caseLike(ch, upper, low); i += 2; continue;
    }
    const singles = {
      a:["А","а"], b:["Б","б"], d:["Д","д"], e:["Е","е"], f:["Ф","ф"],
      g:["Г","г"], h:["Ҳ","ҳ"], i:["И","и"], j:["Ж","ж"], k:["К","к"],
      l:["Л","л"], m:["М","м"], n:["Н","н"], o:["О","о"], p:["П","п"],
      q:["Қ","қ"], r:["Р","р"], s:["С","с"], t:["Т","т"], u:["У","у"],
      v:["В","в"], x:["Х","х"], y:["Й","й"], z:["З","з"]
    };
    const key=ch.toLocaleLowerCase("uz");
    if (singles[key]) out += caseLike(ch, singles[key][0], singles[key][1]);
    else if (isApostrophe(ch)) out += "ъ";
    else out += ch;
    i++;
  }
  return out;
}
async function convert(fn, label) {
  btns.forEach(b=>b.disabled=true);
  statusEl.textContent = "Ishlanmoqda…";
  try {
    await Excel.run(async context => {
      const range = context.workbook.getSelectedRange();
      range.load(["values","formulas"]);
      await context.sync();
      const vals = range.values;
      const formulas = range.formulas;
      let changed=0;
      for (let r=0;r<vals.length;r++) {
        for (let c=0;c<vals[r].length;c++) {
          if (typeof vals[r][c] === "string" && (!formulas[r][c] || !String(formulas[r][c]).startsWith("="))) {
            vals[r][c] = fn(vals[r][c]);
            changed++;
          }
        }
      }
      range.values = vals;
      await context.sync();
      statusEl.textContent = label + " bajarildi.\nTekshirilgan kataklar: " + changed + ".";
    });
  } catch(e) {
    statusEl.textContent = "Xatolik: " + (e && e.message ? e.message : String(e));
  } finally {
    btns.forEach(b=>b.disabled=false);
  }
}
document.getElementById("toLatin").addEventListener("click",()=>convert(cyrToLat,"Кирилл → Лотин"));
document.getElementById("toCyrillic").addEventListener("click",()=>convert(latToCyr,"Лотин → Кирилл"));
if (window.Office) Office.onReady(info => {
  statusEl.textContent = info.host === Office.HostType.Excel ? "Tayyor. Excelda kataklarni belgilang." : "Bu qo‘shimcha Excel uchun.";
});
</script>
</body>
</html>
